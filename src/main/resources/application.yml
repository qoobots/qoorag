server:
  port: 8080

spring:
  datasource:
    # DB_HOST / DB_PORT 可通过 .env 覆盖：本工程 docker-compose 默认把容器映射到宿主 5433，
    # 以避免与机器上其他项目的 PostgreSQL（多为 5432）冲突。
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/qoorag
    username: ${DB_USERNAME:qoorag}
    password: ${DB_PASSWORD:qoorag}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # 监控与健康检查（P2-11）
  jmx:
    enabled: false

# 监控/可观测性（RAG-054）：management 必须顶层，否则被解析为 spring.management.* 而不生效
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: qoorag

qoorag:
  security:
    # 默认管理员初始密码（首次启动由 SeedService 写入，BCrypt 加密）
    default-admin-password: ${ADMIN_DEFAULT_PASSWORD:123456}
    # 知识库软删除保留期（天），过期后定时任务物理清理业务数据
    kb-retention-days: 30
    # 会话令牌 TTL（分钟），过期后需重新登录；每次请求自动续期
    session-ttl-minutes: 120
    # 审计日志留存期（天），超过则定时物理清理；默认 180 天（6 个月，#18）
    audit-retention-days: 180
  # 多轮对话（RAG-044）
  chat:
    session:
      max-turns: 10          # 会话历史保留的最大轮数（每轮=用户提问+助手回答）
      ttl-minutes: 1440      # 会话历史 Redis 留存时长（分钟），过期自动清理
    low-confidence-score: 0.30     # RAG-046：检索 top 分数低于此值视为低置信，走拒答分支（省 LLM 调用）
    medium-confidence-score: 0.55  # RAG-046：低于此值标 medium，否则 high
    # 查询结果缓存（RAG-051）：相同 KB+query+策略参数的结果缓存，命中跳过检索与 LLM
    cache-enabled: true            # 关闭则不缓存（仍按 TTL 失效逻辑存在）
    cache-ttl-minutes: 5           # 缓存留存时长（分钟）；文档变更会主动失效该 KB 缓存
  # 向量缓存（RAG-050）
  embedding:
    cache-enabled: true          # 按 sha256(text|model) 缓存 embedding，重复文档/query 命中跳过外部 API
    cache-ttl-minutes: 1440      # 缓存留存时长（分钟）
    concurrency: 4               # RAG-052：并发 API 调用数（并行多个批次，提升入库吞吐；批量大小见 BailianConfig.embeddingBatchSize）
  # 用量与成本（RAG-053）：单价用于估算费用（与所选 Provider 实际账单口径可能略有差异，按实际调整）
  cost:
    currency: CNY                                  # 费用展示币种
    embedding:
      price-per-1k-tokens: 0.0007                  # text-embedding-v2 约 ¥0.0007/1k tokens
    llm:
      input-price-per-1k-tokens: 0.004             # qwen-plus 输入约 ¥0.004/1k tokens
      output-price-per-1k-tokens: 0.012            # qwen-plus 输出约 ¥0.012/1k tokens
    rerank:
      price-per-1k-tokens: 0.0004                  # qwen3-rerank 约 ¥0.0004/1k tokens
  # 内容安全（#18）：默认关闭；开启需配置阿里云密钥。关闭或异常时 fail-open 放行。
  content-safety:
    enabled: ${CONTENT_SAFETY_ENABLED:false}
    aliyun:
      access-key: ${CONTENT_SAFETY_ALIYUN_AK:}
      secret-key: ${CONTENT_SAFETY_ALIYUN_SK:}
      region: cn-shanghai
      endpoint: https://green.cn-shanghai.aliyuncs.com
  # LLM Provider（OpenAI 兼容模式）。按角色拆分：Chat / Embedding / Rerank 可各自指向不同 Provider。
  #   - 共享默认值（base-url / api-key）：角色未单独配置时回退到这里（兼容旧配置）
  #   - Chat     ← LLM_BASE_URL / LLM_API_KEY / LLM_CHAT_MODEL
  #   - Embedding← EMBEDDING_BASE_URL / EMBEDDING_API_KEY / EMBEDDING_MODEL
  #   - Rerank   ← RERANK_API_KEY / QOORAG_RERANK_ENDPOINT
  # 注意：DeepSeek 只提供 Chat 模型（deepseek-flash / deepseek-v4-pro），不提供 embedding，
  #       因此 embedding 必须另配 Provider，否则 RAG 核心链路不可用（启动期会明确告警）。
  bailian:
    # ---- 共享默认值（旧配置兼容层）----
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    # ---- 旧版百炼专用变量（历史默认来源，Embedding 历来用它）----
    legacy-base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    legacy-api-key: ${ALI-API-KEY:}
    # ---- Chat 角色 ----
    chat-base-url: ${LLM_BASE_URL:}
    chat-api-key: ${LLM_API_KEY:}
    chat-model: ${LLM_CHAT_MODEL:qwen-plus}
    # ---- Embedding 角色 ----
    embedding-base-url: ${EMBEDDING_BASE_URL:}
    embedding-api-key: ${EMBEDDING_API_KEY:}
    embedding-model: ${EMBEDDING_MODEL:text-embedding-v2}
    embedding-batch-size: ${EMBEDDING_BATCH_SIZE:25}
  # 检索增强（#retrieval-tuning）
  # 模式说明（rerank-mode）：
  #   none          仅向量 ANN 召回（改造前行为，用于 A/B 基线）
  #   hybrid-rrf    【默认】向量路（pgvector HNSW 余弦）+ 词法路（PG 全文检索 GIN/ts_rank_cd）
  #                 RRF 名次融合 + 多样性去冗余。词法路可捞回向量被大文档淹没的短片段，
  #                 也命中专名/型号/编号类 query。
  #   diversity     仅向量路 + 多样性去冗余（不引入词法路）
  #   legacy-hybrid 改造前的「向量 + Java bigram 覆盖率」伪混合，仅保留作 A/B 基线，勿用于生产
  #                 （无索引、无 IDF、长文档天然占优）
  # 历史基线（legacy-hybrid，评测集 10 条）：Recall@2 49.2%→57.0%、HitRate 89%→97%、
  #                 Precision 70.3%→57.8%；cand=200 + topK=20 下 Recall≈93%（见 eval_sweep3）
  retrieval:
    candidate-pool: 200      # 放大候选池：让向量排名靠后的相关文档也能进入重排（Recall 关键杠杆）
    min-score: 0.0           # 最低相似度阈值，0=不过滤
    rerank-mode: hybrid-rrf  # none | hybrid-rrf | diversity | legacy-hybrid
    diversity-max-per-doc: 2 # 多样性重排时单文档最多保留片段数
    rrf-k: 60                # RRF 融合平滑常数
    top-k: 20                # 生产检索/问答默认召回条数；cand=200+topK=20 下 Recall≈93%（见 eval_sweep3）
    mmr-enabled: false       # RAG-018：MMR 多样性重排（精排后开启，默认关，避免未评估回归）
    mmr-lambda: 0.5          # 相关性 vs 多样性 权衡：越大越偏相关，越小越偏多样
    query-rewrite-enabled: false  # RAG-015：检索前查询改写（默认关，避免未评估回归）
    lexical-pool: 200        # 词法路召回条数（RAG-011）；0 = 关闭词法检索
    lexical-min-score: 0.0   # 最低词法相关度（ts_rank_cd），0=不过滤
    # 上下文工程（RAG-041）：参考资料组装
    max-context-tokens: 3000 # 喂给 LLM 的参考资料估算 token 上限；<=0 不限制
    context-reorder: true    # Lost-in-the-Middle 缓解：最相关片段放首尾、次相关放中间
    max-chunk-chars: 1200    # 单块在 Prompt 中的最大字符数；<=0 不截断
    # RAG-022 父子块（small-to-big）：命中子块后回填父块上下文，提升答案完整性；引用仍指向子块
    small-to-big:
      enabled: true           # 关闭则退化为直接使用子块内容
    rerank:
      enabled: ${RERANK_ENABLED:false} # 精排开关（.env: RERANK_ENABLED）；关闭时检索照常，只是不精排
      endpoint: ${QOORAG_RERANK_ENDPOINT:}  # 百炼 rerank 专属域名（MAAS 工作空间），需填入真实业务空间 ID
      api-key: ${RERANK_API_KEY:}   # 精排服务密钥；留空则回退到 EMBEDDING_API_KEY / 共享密钥。rerank 与 chat 常不同域，密钥也可能不同
      top-n: ${RERANK_TOP_N:5}      # 精排后保留条数（保住召回的同时压低噪声、节省 token）
      model: ${RERANK_MODEL:qwen3-vl-rerank}  # 百炼 rerank 模型（gte-rerank 已于 2026-05-30 下线，推荐 qwen3-rerank），默认复用 embedding 密钥
  # 异步入库（RAG-030）
  ingest:
    chunk-strategy: structure  # 分块策略：structure（结构感知，RAG-021）/ fixed（改造前固定长度）
    # RAG-022 父子块：连续多少个子块聚合成一个父块（生成上下文单元）；<=1 表示不启用
    parent-chunk-group-size: 4
    workers: 2                 # 后台入库线程数；过大将同时压满 embedding API 与 DB
    queue-capacity: 100        # 内存队列容量；超出后由调用线程直接执行（不丢任务）
    # Contextual Chunking（RAG-023）：为每个 chunk 生成"它在原文中的位置与内容"说明，
    # 拼在原文前一起 embedding 与建词法索引。默认关闭——每 chunk 多一次 LLM 调用。
    # 官方实测：仅 Contextual Embedding 使 top-20 检索失败率 -35%，叠加 Contextual BM25 -49%。
    # 只影响离线入库，不增加在线延迟。开启后存量数据需调 POST /api/admin/contextual/rebuild。
    contextual:
      enabled: false           # 默认关闭：成本敏感，需显式开启
      model: ""                # 生成前缀用的模型；留空复用 qoorag.bailian.chat-model（建议换轻量模型降本）
      max-prefix-chars: 200    # 前缀最大字符数
      temperature: 0.1         # 低温保证前缀稳定可复现
  # 评测闭环（RAG-000 / RAG-003）
  eval:
    judge-model: ""          # 生成端评估的 Judge 模型；留空则复用 qoorag.bailian.chat-model
    sample-ratio: 0.3        # 生成端指标抽样比例 0~1；judge 调用有成本，不建议全量
    max-judge-calls: 50      # 单次评测最大 judge 调用条数（成本保护）
  # 向量库索引参数（RAG-010）：HNSW ANN 索引由启动期 PgvectorIndexMigrator 幂等创建
  vector:
    store: pgvector            # 向量存储后端：pgvector（默认）| milvus（RAG-068，待实现）
    hnsw:
      m: 16               # HNSW 每节点最大连接数（构建期参数，改后需 REINDEX）
      ef-construction: 128 # HNSW 构建期搜索宽度（构建期参数，改后需 REINDEX）
      ef-search: 40        # HNSW 查询期搜索宽度（运行时生效，调大提高召回/延迟；<=0 用 pgvector 默认值）
