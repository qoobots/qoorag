# ============================================================================
# qoorag 本地开发用 Milvus（3 容器：etcd + minio + milvus）——本工程自包含中间件，
# 统一归属 qoorag（compose project=qoorag，容器名一律 qoorag-milvus-*），
# 不借用机器上其它工程的 Milvus / etcd / minio。
#
# 用法： docker compose -f scripts/milvus-docker-compose.yml up -d
# 停：   docker compose -f scripts/milvus-docker-compose.yml down
# 端口： gRPC 19530（Java SDK 连接，MILVUS_URI 如 http://localhost:19530），
#       HTTP 9091（attu/metrics）。若宿主 19530/9091 已被其它工程占用，
#       自行把左侧宿主端口改成空闲端口（如 19531:19530）并同步 MILVUS_URI。
# 数据： ./qoorag-milvus-volumes/（位于本工程 scripts 目录下，删除即重置）
# ============================================================================

name: qoorag

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: qoorag-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./qoorag-milvus-volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    # 原固定 RELEASE.2024-05-28T17-19-04Z，但本机镜像节点对该老 tag 持续繁忙/403 拉不动；
    # 换用同线新版本（S3 兼容 API 不变，Milvus 2.6 无差异）。如需严格对齐旧版本，
    # 改回后请先确认镜像可拉取。
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: qoorag-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./qoorag-milvus-volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.6.24
    container_name: qoorag-milvus
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./qoorag-milvus-volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
